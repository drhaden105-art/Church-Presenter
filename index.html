<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ChurchPresenter V2</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- TOP BAR -->
  <header class="topbar">

    <div class="brand">
      ✦ <strong>ChurchPresenter</strong>
      <span>V2</span>
    </div>

    <div class="service-name">
      Sunday Service
    </div>

    <div class="live-status">
      <span class="live-dot"></span>
      READY
    </div>

  </header>


  <!-- MAIN APPLICATION -->

  <main class="app">

    <!-- LIBRARY -->

    <aside class="sidebar">

      <h3>LIBRARY</h3>

      <button class="nav-btn active" onclick="showCategory('bible')">
        📖 Bible
      </button>

      <button class="nav-btn" onclick="showCategory('songs')">
        🎵 Songs
      </button>

      <button class="nav-btn" onclick="showCategory('slides')">
        🖼️ Slides
      </button>

      <button class="nav-btn" onclick="showCategory('media')">
        🎬 Media
      </button>

      <button class="nav-btn" onclick="showCategory('announcements')">
        📢 Announcements
      </button>

      <div class="sidebar-bottom">

        <button onclick="savePlaylist()">
          💾 Save Service
        </button>

        <button onclick="loadPlaylist()">
          📂 Load Service
        </button>

      </div>

    </aside>


    <!-- CENTER -->

    <section class="center">

      <div class="toolbar">

        <div>
          <h2 id="categoryTitle">Bible</h2>
          <p id="categoryDescription">
            Search and add Scripture to your service.
          </p>
        </div>

        <input
          id="search"
          type="search"
          placeholder="Search library..."
          oninput="searchLibrary()"
        >

      </div>


      <div id="items" class="items"></div>

    </section>


    <!-- RIGHT SIDE -->

    <aside class="right-panel">

      <h3>PREVIEW</h3>

      <div id="previewScreen" class="preview-screen">

        <div class="preview-title">
          ChurchPresenter
        </div>

        <div class="preview-subtitle">
          Select an item
        </div>

      </div>


      <div class="preview-info">

        <strong id="previewTitle">
          Nothing selected
        </strong>

        <p id="previewText">
          Choose something from the library.
        </p>

      </div>


      <button
        class="go-live"
        onclick="goLive()"
      >
        🔴 GO LIVE
      </button>

      <button
        class="add-playlist"
        onclick="addCurrentToPlaylist()"
      >
        ＋ Add to Service
      </button>

    </aside>

  </main>


  <!-- PLAYLIST -->

  <section class="playlist-panel">

    <div class="playlist-header">

      <div>
        <strong>Service Playlist</strong>
        <span id="playlistCount">0 items</span>
      </div>

      <button onclick="clearPlaylist()">
        Clear
      </button>

    </div>


    <div
      id="playlist"
      class="playlist"
    >

      <div class="empty-playlist">
        Your service playlist is empty.
      </div>

    </div>

  </section>


  <!-- LIVE OUTPUT -->

  <div
    id="liveScreen"
    class="live-screen"
  >

    <button
      class="close-live"
      onclick="closeLive()"
    >
      ✕
    </button>


    <div id="liveContent">

      <h1>ChurchPresenter</h1>

      <p>
        Live Output
      </p>

    </div>

  </div>


  <script src="app.js"></script>

</body>
</html>
